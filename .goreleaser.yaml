# GoReleaser configuration for NexProwl.
# Validate with:  goreleaser check
# Dry run with:   goreleaser release --snapshot --clean
version: 2

project_name: nexprowl

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: nexprowl
    # The CLI entrypoint is the module root package.
    main: .
    binary: nexprowl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # These -X paths are pinned by TestVersionLinkerFlags in main_test.go.
    ldflags:
      - -s -w
      - -X github.com/Arseno25/nexprowl/internal/scanner.Version={{ .Version }}
      - -X github.com/Arseno25/nexprowl/internal/scanner.Commit={{ .FullCommit }}
      - -X github.com/Arseno25/nexprowl/internal/scanner.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: nexprowl
    ids:
      - nexprowl
    # Produces e.g. nexprowl_0.1.0_linux_amd64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - src: docs/USAGE.md
        dst: docs
        strip_parent: true

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Linux packages, attached to each release. There is no hosted APT or DNF
# repository, so these do not auto-update.
nfpms:
  - id: nexprowl
    ids:
      - nexprowl
    package_name: nexprowl
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Arseno25
    homepage: https://github.com/Arseno25/nexprowl
    maintainer: Arseno25 <utomnestagumara@gmail.com>
    description: |-
      Fast, single-binary reconnaissance engine.
      NexProwl combines DNS reconnaissance, subdomain discovery, port scanning,
      HTTP probing, TLS analysis, virtual host discovery, subdomain takeover
      detection, and crawling into one dependency-light binary. Intended for
      authorized security testing only.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: net
    priority: optional
    contents:
      - src: LICENSE
        dst: /usr/share/doc/nexprowl/LICENSE
      - src: README.md
        dst: /usr/share/doc/nexprowl/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/nexprowl/CHANGELOG.md
      - src: SECURITY.md
        dst: /usr/share/doc/nexprowl/SECURITY.md
      - src: docs/USAGE.md
        dst: /usr/share/doc/nexprowl/USAGE.md
    # Chrome is only needed for -screenshot, so it must not be a hard
    # dependency of a tool that works fine without it.
    suggests:
      - chromium

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    # Housekeeping commits are noise in a user-facing changelog.
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - "^build:"
      - "^refactor:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99

release:
  github:
    owner: Arseno25
    name: nexprowl
  draft: false
  prerelease: auto
  mode: append
  footer: |
    ## Verifying downloads

    Download `checksums.txt` alongside your archive, then:

    ```bash
    sha256sum -c checksums.txt --ignore-missing
    ```

    ---

    **NexProwl is for authorized security testing only.** Scanning systems you
    do not own or have written permission to test may be illegal.
