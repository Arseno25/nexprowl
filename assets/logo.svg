<svg width="880" height="300" viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#060E1A"/>
      <stop offset="70%" stop-color="#0B1525"/>
      <stop offset="100%" stop-color="#0D1F3C"/>
    </radialGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanlines" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#1A3A5C" opacity="0.10"/>
    </pattern>
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141B2E" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="880" height="300" rx="24" fill="#0B0F1A"/>
  <rect x="0" y="0" width="880" height="300" rx="24" fill="url(#bgGrid)"/>
  <rect x="1.5" y="1.5" width="877" height="297" rx="22.5" fill="none" stroke="url(#grad)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- ambient glow behind radar -->
  <circle cx="170" cy="140" r="140" fill="url(#radarGlow)"/>

  <!-- scanner / radar face -->
  <g transform="translate(170,140)">
    <!-- dark background -->
    <circle r="102" fill="url(#radarBg)"/>

    <!-- scanline overlay -->
    <circle r="102" fill="url(#scanlines)"/>

    <!-- grid lines — 45° radial -->
    <g stroke="#15223D" stroke-width="1">
      <line x1="-100" y1="0" x2="100" y2="0"/>
      <line x1="0" y1="-100" x2="0" y2="100"/>
      <line x1="-71" y1="-71" x2="71" y2="71"/>
      <line x1="71" y1="-71" x2="-71" y2="71"/>
    </g>

    <!-- concentric rings -->
    <circle r="102" fill="none" stroke="url(#grad)" stroke-width="3"/>
    <circle r="75" fill="none" stroke="#1E2E50" stroke-width="1.5"/>
    <circle r="48" fill="none" stroke="#1E2E50" stroke-width="1.5"/>
    <circle r="21" fill="none" stroke="#1E2E50" stroke-width="1.5"/>

    <!-- crosshair ticks — crossing r=102 -->
    <line x1="0" y1="-116" x2="0" y2="-88" stroke="url(#grad)" stroke-width="3"/>
    <line x1="0" y1="88" x2="0" y2="116" stroke="url(#grad)" stroke-width="3"/>
    <line x1="-116" y1="0" x2="-88" y2="0" stroke="url(#grad)" stroke-width="3"/>
    <line x1="88" y1="0" x2="116" y2="0" stroke="url(#grad)" stroke-width="3"/>

    <!-- sweep beam — 45° wedge -->
    <path d="M0 0 L102 0 A102 102 0 0 0 72 -72 Z" fill="url(#sweepGrad)"/>
    <line x1="0" y1="0" x2="72" y2="-72" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" opacity="0.15"/>
    <line x1="0" y1="0" x2="72" y2="-72" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

    <!-- detected blip — strong signal -->
    <circle cx="28" cy="-18" r="5.5" fill="#00E5FF"/>
    <circle cx="28" cy="-18" r="11" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.5"/>
    <circle cx="28" cy="-18" r="17" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.2"/>

    <!-- detected blip — magenta, medium -->
    <circle cx="-50" cy="32" r="4.5" fill="#D500F9"/>
    <circle cx="-50" cy="32" r="9" fill="none" stroke="#D500F9" stroke-width="1.5" opacity="0.45"/>

    <!-- detected blip — green, far range -->
    <circle cx="-12" cy="66" r="3.5" fill="#69F0AE"/>
    <circle cx="-12" cy="66" r="7" fill="none" stroke="#69F0AE" stroke-width="1" opacity="0.35"/>

    <!-- detected blip — amber, edge -->
    <circle cx="72" cy="-34" r="3" fill="#FFD740"/>
    <circle cx="72" cy="-34" r="6" fill="none" stroke="#FFD740" stroke-width="1" opacity="0.3"/>

    <!-- center node -->
    <circle r="6" fill="url(#grad)"/>
    <circle r="12" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.55"/>
    <circle r="20" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- wordmark -->
  <text x="330" y="158" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="64" font-weight="700" letter-spacing="1">
    <tspan fill="#69F0AE">&gt;_</tspan><tspan fill="url(#gradText)" dx="14">NexProwl</tspan>
  </text>

  <!-- tagline -->
  <text x="334" y="195" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="19" letter-spacing="4.5" fill="#8A93B2">ALL-IN-ONE DOMAIN RECONNAISSANCE</text>

  <!-- module strip -->
  <text x="334" y="218" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10.5" letter-spacing="0.5" fill="#5A6480">dns·axfr·sub·ports·http·vhost·tls·takeover</text>

  <!-- meta chips -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15">
    <rect x="334" y="240" width="150" height="30" rx="15" fill="none" stroke="#2A3B5F" stroke-width="1.5"/>
    <text x="409" y="260" text-anchor="middle" fill="#8A93B2">by shadow0x0</text>
  </g>
</svg>
