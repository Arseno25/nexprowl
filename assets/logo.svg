<svg width="880" height="300" viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141B2E" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="880" height="300" rx="24" fill="#0B0F1A"/>
  <rect x="0" y="0" width="880" height="300" rx="24" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="877" height="297" rx="22.5" fill="none" stroke="url(#grad)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- glow behind radar -->
  <circle cx="170" cy="150" r="130" fill="url(#glow)"/>

  <!-- radar / recon emblem -->
  <g transform="translate(170,150)">
    <circle r="102" fill="none" stroke="url(#grad)" stroke-width="3"/>
    <circle r="72" fill="none" stroke="#223052" stroke-width="2"/>
    <circle r="42" fill="none" stroke="#223052" stroke-width="2"/>

    <!-- crosshair ticks — centered on r=102 -->
    <line x1="0" y1="-115" x2="0" y2="-89" stroke="url(#grad)" stroke-width="3"/>
    <line x1="0" y1="89" x2="0" y2="115" stroke="url(#grad)" stroke-width="3"/>
    <line x1="-115" y1="0" x2="-89" y2="0" stroke="url(#grad)" stroke-width="3"/>
    <line x1="89" y1="0" x2="115" y2="0" stroke="url(#grad)" stroke-width="3"/>

    <!-- radar sweep -->
    <path d="M0 0 L102 0 A102 102 0 0 0 51 -88.5 Z" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="72" y2="-72" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

    <!-- detected blips -->
    <circle cx="38" cy="-24" r="5.5" fill="#00E5FF"/>
    <circle cx="38" cy="-24" r="10" fill="none" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="-52" cy="34" r="4.5" fill="#D500F9"/>
    <circle cx="-14" cy="62" r="3.5" fill="#69F0AE"/>

    <!-- center node -->
    <circle r="7" fill="url(#grad)"/>
    <circle r="13" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- wordmark -->
  <text x="330" y="168" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="86" font-weight="700" letter-spacing="2">
    <tspan fill="#69F0AE">&gt;_</tspan><tspan fill="url(#gradText)" dx="14">dscan</tspan>
  </text>

  <!-- tagline -->
  <text x="334" y="212" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="19" letter-spacing="4.5" fill="#8A93B2">ALL-IN-ONE DOMAIN RECONNAISSANCE</text>

  <!-- meta chips -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15">
    <rect x="334" y="234" width="96" height="30" rx="15" fill="none" stroke="url(#grad)" stroke-width="1.5"/>
    <text x="382" y="254" text-anchor="middle" fill="#00E5FF">v1.0.0</text>

    <rect x="444" y="234" width="150" height="30" rx="15" fill="none" stroke="#2A3B5F" stroke-width="1.5"/>
    <text x="519" y="254" text-anchor="middle" fill="#8A93B2">by shadow0x0</text>
  </g>

  <!-- module strip -->
  <text x="334" y="282" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#5A6480">dns · axfr · sub · ports · http · vhost · tls · takeover</text>
</svg>
