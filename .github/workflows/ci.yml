name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -count=1 -race -coverprofile=coverage.out ./...
      - name: Enforce coverage floor
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          echo "Total coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total < 70) exit 1 }'
      - name: Build
        run: go build ./...

  cross-build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Every platform the release ships must at least compile on every PR.
      - name: Build release targets
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null .
          done

  goreleaser-check:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Catches a broken .goreleaser.yaml on the PR instead of on the tag.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
