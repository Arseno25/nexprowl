name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -count=1 -race ./...
      - name: Build
        run: go build ./...

  release:
    name: GoReleaser
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      # Required so GoReleaser can create the GitHub Release and upload assets.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the full history and tags to build the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
          # The brews block pushes the formula to Arseno25/homebrew-tap, a
          # different repository, which the built-in GITHUB_TOKEN cannot do.
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
